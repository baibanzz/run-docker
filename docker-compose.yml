services:
  etcd:
    image: faliarin/etcd:latest
    container_name: etcd-server
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://localhost:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    volumes:
      - shared-data:/etcd-data
    networks:
      - app-network
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: mysql-server
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=88888888
    volumes:
      - shared-data:/data/mysql
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:8.0
    container_name: redis-server
    ports:
      - "6379:6379"
    command: redis-server --requirepass 88888888
    volumes:
      - shared-data:/data/redis
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:latest
    container_name: postgres-server
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=88888888
    volumes:
      - shared-data:/data/postgres
    networks:
      - app-network
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:latest
    container_name: nacos-server
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      - MODE=standalone
      - SPRING_DATASOURCE_PLATFORM=derby
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlTZWNyZXRLZXlGb3JOYWNvc0F1dGgyMDI1
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
    volumes:
      - shared-data:/home/nacos/data
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  shared-data: